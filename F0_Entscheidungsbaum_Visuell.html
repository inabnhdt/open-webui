const COLORS = {
  decision:  { fill: '#ebf8ff', stroke: '#4299e1', text: '#2a4365' },
  diagnosis: { fill: '#f0fff4', stroke: '#48bb78', text: '#276749' },
  exclude:   { fill: '#fff5f5', stroke: '#fc8181', text: '#9b2c2c' },
  subtype:   { fill: '#faf5ff', stroke: '#9f7aea', text: '#553c9a' },
  link:      { fill: '#fffff0', stroke: '#ecc94b', text: '#744210' }
};

const NODE_W = 140, NODE_H = 72, H_GAP = 32, V_GAP = 90;

function countLeaves(node) {
  if (!node.children || node.children.length === 0) return 1;
  return node.children.reduce((s, c) => s + countLeaves(c), 0);
}

function layoutTree(node, depth, xStart) {
  const leaves = countLeaves(node);
  const totalW = leaves * (NODE_W + H_GAP) - H_GAP;
  node._x = xStart + totalW / 2;
  node._y = depth * (NODE_H + V_GAP) + 40;
  node._w = NODE_W;
  node._h = NODE_H;

  if (node.children && node.children.length > 0) {
    let cx = xStart;
    for (const child of node.children) {
      const cl = countLeaves(child);
      const cw = cl * (NODE_W + H_GAP) - H_GAP;
      layoutTree(child, depth + 1, cx);
      cx += cw + H_GAP;
    }
  }
}

function collectNodes(node, list) {
  list.push(node);
  if (node.children) node.children.forEach(c => collectNodes(c, list));
  return list;
}

function collectEdges(node, list) {
  if (node.children) {
    for (const c of node.children) {
      list.push({ from: node, to: c, label: c.edge || '' });
      collectEdges(c, list);
    }
  }
  return list;
}

function wrapText(text, maxChars) {
  return text.split('\n');
}

let currentScale = 1;
const tooltip = document.getElementById('tooltip');

function buildSVG() {
  layoutTree(TREE, 0, 40);
  const allNodes = collectNodes(TREE, []);
  const allEdges = collectEdges(TREE, []);

  let maxX = 0, maxY = 0;
  for (const n of allNodes) {
    maxX = Math.max(maxX, n._x + n._w / 2 + 60);
    maxY = Math.max(maxY, n._y + n._h + 60);
  }

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}">`;

  // marker
  svg += `<defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#718096"/>
    </marker>
  </defs>`;

  // edges
  for (const e of allEdges) {
    const x1 = e.from._x, y1 = e.from._y + e.from._h;
    const x2 = e.to._x, y2 = e.to._y;
    const midY = (y1 + y2) / 2;

    const edgeTags = e.to.tags || [];
    const tagAttr = edgeTags.length ? ` data-tags="${edgeTags.join(',')}"` : '';

    svg += `<g class="edge"${tagAttr}>`;
    svg += `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" marker-end="url(#arrowhead)"/>`;

    if (e.label) {
      const lx = (x1 + x2) / 2;
      const ly = midY - 2;
      const lines = e.label.split('\n');
      const lineH = 13;
      const startY = ly - ((lines.length - 1) * lineH) / 2;

      // background
      const maxLen = Math.max(...lines.map(l => l.length));
      const bgW = maxLen * 6.5 + 10;
      const bgH = lines.length * lineH + 6;
      svg += `<rect x="${lx - bgW/2}" y="${startY - lineH + 2}" width="${bgW}" height="${bgH}" rx="4" fill="white" fill-opacity="0.9" stroke="none"/>`;

      for (let i = 0; i < lines.length; i++) {
        svg += `<text class="edge-label"${tagAttr} x="${lx}" y="${startY + i * lineH}" text-anchor="middle">${escHtml(lines[i])}</text>`;
      }
    }
    svg += '</g>';
  }

  // nodes
  for (const n of allNodes) {
    const c = COLORS[n.type] || COLORS.decision;
    const x = n._x - n._w / 2;
    const tagAttr = (n.tags && n.tags.length) ? ` data-tags="${n.tags.join(',')}"` : '';

    svg += `<g class="node" data-id="${n.id}"${tagAttr}>`;
    if (n.type === 'diagnosis' || n.type === 'subtype' || n.type === 'exclude') {
      svg += `<rect x="${x}" y="${n._y}" width="${n._w}" height="${n._h}" rx="10" fill="${c.fill}" stroke="${c.stroke}"/>`;
    } else {
      svg += `<rect x="${x}" y="${n._y}" width="${n._w}" height="${n._h}" rx="6" fill="${c.fill}" stroke="${c.stroke}"/>`;
    }

    const lines = wrapText(n.label, 16);
    const lineH = 14;
    const totalH = lines.length * lineH;
    const startY = n._y + (n._h - totalH) / 2 + lineH - 2;

    for (let i = 0; i < lines.length; i++) {
      const isBold = lines[i].match(/^F\d/);
      svg += `<text x="${n._x}" y="${startY + i * lineH}" text-anchor="middle" fill="${c.text}" font-size="${isBold ? 13 : 11.5}" font-weight="${isBold ? 700 : 400}">${escHtml(lines[i])}</text>`;
    }

    svg += '</g>';
  }

  svg += '</svg>';
  document.getElementById('svgContainer').innerHTML = svg;

  // tooltip events
  document.querySelectorAll('.node').forEach(el => {
    el.addEventListener('mouseenter', e => {
      const id = el.dataset.id;
      const node = allNodes.find(n => n.id === id);
      if (node && node.detail) {
        tooltip.textContent = node.detail;
        tooltip.style.display = 'block';
      }
    });
    el.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY + 15) + 'px';
    });
    el.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightPath(tag) {
  const svg = document.querySelector('svg');
  svg.classList.add('highlight');

  document.querySelectorAll('.node').forEach(el => {
    const tags = (el.dataset.tags || '').split(',');
    el.classList.toggle('hl', tags.includes(tag));
  });
  document.querySelectorAll('.edge').forEach(el => {
    const tags = (el.dataset.tags || '').split(',');
    el.classList.toggle('hl', tags.includes(tag));
  });
  document.querySelectorAll('.edge-label').forEach(el => {
    const tags = (el.dataset.tags || '').split(',');
    el.classList.toggle('hl', tags.includes(tag));
  });
}

function resetView() {
  const svg = document.querySelector('svg');
  svg.classList.remove('highlight');
  document.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
}

function zoomIn() {
  currentScale = Math.min(currentScale + 0.15, 2.5);
  document.getElementById('svgContainer').style.transform = `scale(${currentScale})`;
  document.getElementById('svgContainer').style.transformOrigin = 'top left';
}

function zoomOut() {
  currentScale = Math.max(currentScale - 0.15, 0.3);
  document.getElementById('svgContainer').style.transform = `scale(${currentScale})`;
  document.getElementById('svgContainer').style.transformOrigin = 'top left';
}

buildSVG();
</script>
</body>
</html>
