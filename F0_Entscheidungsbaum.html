let history = [];

function render(nodeId) {
  const node = nodes[nodeId];
  const app = document.getElementById('app');
  history.push(nodeId);

  if (node.diagnosis) {
    renderDiagnosis(node, app);
  } else {
    renderQuestion(node, nodeId, app);
  }
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function renderBreadcrumb() {
  if (history.length <= 1) return '';
  const labels = {
    start: 'Start', bewusstsein: 'Bewusstsein', delir_check: 'Delir',
    demenz_check: 'Demenz', demenz_ursache: 'Ursache', alzheimer_onset: 'Beginn',
    vaskular_typ: 'Vaskulär', amnesie_check: 'Amnesie', persoenlichkeit_check: 'Persönlichkeit',
    f06_typ: 'F06', f06_weitere: 'F06 Detail', f066_7_8: 'F06.6-8',
    delir_demenz: 'Delir+Demenz', f07_typ: 'F07'
  };
  return '<div class="breadcrumb">' +
    history.filter(h => !nodes[h].diagnosis).map(h => `<span>${labels[h] || h}</span>`).join('') +
    '</div>';
}

function renderQuestion(node, nodeId, app) {
  let html = '<div class="card">';
  html += renderBreadcrumb();
  if (node.info) html += `<div class="info-box">${node.info}</div>`;
  html += `<div class="question">${node.question}</div>`;
  html += '<div class="btn-group">';
  node.options.forEach(opt => {
    html += `<button class="btn" onclick="render('${opt.next}')">${opt.text}</button>`;
  });
  html += '</div></div>';
  app.innerHTML = html;
}

function renderDiagnosis(node, app) {
  let html = '<div class="card diagnosis-card">';
  html += renderBreadcrumb();
  html += `<span class="code">${node.code}</span>`;
  html += `<h2>${node.title}</h2>`;
  html += `<p>${node.description}</p>`;
  if (node.criteria) {
    html += '<ul>';
    node.criteria.forEach(c => html += `<li>${c}</li>`);
    html += '</ul>';
  }
  if (node.subtypes) {
    html += '<div class="subtype"><strong>Kodierung / Subtypen:</strong><ul>';
    node.subtypes.forEach(s => html += `<li>${s}</li>`);
    html += '</ul></div>';
  }
  if (node.exclusion) {
    html += `<div class="exclusion">${node.exclusion}</div>`;
  }
  html += `<button class="restart-btn" onclick="restart()">Neu starten</button>`;
  html += '</div>';
  app.innerHTML = html;
}

function restart() {
  history = [];
  render('start');
}

render('start');
</script>
